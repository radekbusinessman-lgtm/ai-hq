[project]
name = "ai-hq"
version = "0.1.0"
description = "AI HQ – Autonomous Business Operating System (AI Chief of Staff)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "discord.py>=2.4",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",  # časová pásma i v kontejneru bez systémového tzdata
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert v testech je v pořádku

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
